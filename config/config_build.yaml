# Knowledge Graph Build Configuration
# Configuration for building the knowledge graph from documents
#
# NOTE: Common settings (paths, models, database, logging, performance)
# are loaded from config.yaml

# ============================================================================
# GRAPH CONSTRUCTION PARAMETERS
# ============================================================================
graph_construction:
  # Data loading
  max_documents: -1  # Maximum number of documents to process (-1 for all)

  # Text chunking
  chunk_size: 500  # Size of text chunks in characters
  chunk_overlap: 100  # Overlap between chunks in characters

  # Topic modeling (BERTopic)
  min_topic_size: 10  # Minimum size for a topic (trade-off between granularity and number of topics)
  nr_topics: null  # Number of topics (null = auto-detect)
  topic_probability_threshold: 0.15  # Minimum probability to create HAS_TOPIC edge

  # Entity extraction thresholds
  co_occurrence_threshold: 2  # Minimum co-occurrences to create edge
  semantic_similarity_threshold: 0.8  # Minimum similarity for entity/theme SEMANTIC_SIM edges
  claim_sim_threshold: 0.5  # Minimum similarity for CLAIM_SIM edges (lower than entity threshold)

  # Temporal similarity (for DATE entities)
  temporal_max_year_gap: 10  # Maximum year difference to create TEMPORAL_DIST edges
  temporal_decay_rate: 0.15  # Exponential decay rate for temporal similarity (weight = exp(-rate * year_diff))
  # Lower rate = slower decay (0.15 recommended: 1yr→0.86, 5yr→0.47, 10yr→0.22)

  # Topic keyword processing
  topic_keywords_initial: 15  # Number of keywords to retrieve from BERTopic initially
  topic_keywords_final: 10  # Number of keywords after stemming and deduplication

  # Keyphrase extraction (KeyBERT)
  keyphrase_top_n: 5  # Number of keyphrases to extract per chunk
  keyphrase_ngram_min: 1  # Minimum n-gram size for keyphrases
  keyphrase_ngram_max: 2  # Maximum n-gram size for keyphrases

  # Entity types to extract (spaCy)
  entity_types:
    - "PERSON"  # People, including fictional
    - "ORG"  # Companies, agencies, institutions
    - "GPE"  # Countries, cities, states
    - "LOC"  # Non-GPE locations, mountain ranges, bodies of water
    - "DATE"  # Absolute or relative dates or periods
    - "EVENT"  # Named hurricanes, battles, wars, sports events
    - "NORP"  # Nationalities or religious or political groups

# ============================================================================
# BUILD-SPECIFIC MODEL CONFIGURATION
# ============================================================================
models:
  # LLM for topic labeling (Ollama) - only used during build
  llm_model: "llama3.1:latest"  # Ollama model for topic labeling
  llm_endpoint: "http://localhost:11434/api/generate"

# ============================================================================
# LLM BATCH LABELING CONFIGURATION
# ============================================================================
llm_batch_labeling:
  # Prompt template for batched topic labeling
  # Placeholders: {{topics_json}} - JSON array of topics with id and keywords
  prompt_template: |
    You are a topic labeling assistant. For each topic below, generate a short, clear label (2-4 words).

    Topics to label:
    {{topics_json}}

    Return ONLY a JSON object in this exact format, no extra text:
    {"labels":[{"id":<topic_id>,"label":"<2-4 word label>"},...]}"

  # Batch size settings
  batch_size_default: 10  # Starting batch size
  batch_size_min: 1  # Minimum batch size (floor)
  batch_size_max: 25  # Maximum batch size (cap)
  batch_size_step: 5  # Step for increasing batch size

  # Label constraints
  label_min_words: 1  # Minimum words in label
  label_max_words: 4  # Maximum words in label
  label_max_length: 50  # Maximum character length for labels

  # Keywords per topic
  max_keywords_per_topic: 8  # Number of keywords to send per topic

  # Retry settings
  retry_count: 2  # Number of retries on failure
  retry_temperature: 0.0  # Temperature for retry attempts (stricter)

  # Timeout settings
  batch_timeout: 60  # Timeout for batch requests in seconds

  # Auto-tuning settings
  success_streak_threshold: 3  # Consecutive successes before increasing batch size
  hysteresis_decrease_factor: 0.5  # Factor to decrease batch size on failure (e.g., 0.5 = halve)

  # Failure strategy: "binary_split" or "single_fallback"
  # binary_split: Split failed batch in half and retry each half
  # single_fallback: Fall back to single-topic requests for remaining items
  failure_strategy: "binary_split"

# ============================================================================
# EXPORT CONFIGURATION
# ============================================================================
export:
  # Build-specific file naming patterns
  graph_pickle_pattern: "knowledge_graph_{timestamp}.gpickle"
  topic_model_pattern: "topic_model_{timestamp}.pkl"
