# Knowledge Graph Fact-Checking System Configuration
# This file contains all configurable parameters for the system

# ============================================================================
# PATHS CONFIGURATION
# ============================================================================
paths:
  # Data directories
  data_dir: "data"
  csv_file: "data/english_fact_checks.csv"

  # Output directories
  outputs_dir: "outputs"
  graphs_dir: "outputs/graphs"
  visualizations_dir: "outputs/visualizations"
  models_dir: "outputs/models"
  exports_dir: "outputs/exports"

  # Logs directory
  logs_dir: "logs"

# ============================================================================
# GRAPH CONSTRUCTION PARAMETERS
# ============================================================================
graph_construction:
  # Data loading
  max_documents: 100  # Maximum number of documents to process (-1 for all)

  # Text chunking
  chunk_size: 500  # Size of text chunks in characters
  chunk_overlap: 100  # Overlap between chunks in characters

  # Topic modeling (BERTopic)
  min_topic_size: 10  # Minimum size for a topic
  nr_topics: null  # Number of topics (null = auto-detect)

  # Entity extraction thresholds
  co_occurrence_threshold: 2  # Minimum co-occurrences to create edge
  semantic_similarity_threshold: 0.6  # Minimum similarity for entity edges
  entity_theme_relation_threshold: 0.5  # Minimum weight for entity-theme edges

  # Entity types to extract (spaCy)
  entity_types:
    - "PERSON"  # People, including fictional
    - "ORG"  # Companies, agencies, institutions
    - "GPE"  # Countries, cities, states
    - "LOC"  # Non-GPE locations, mountain ranges, bodies of water
    - "DATE"  # Absolute or relative dates or periods
    - "EVENT"  # Named hurricanes, battles, wars, sports events
    - "NORP"  # Nationalities or religious or political groups

# ============================================================================
# MODEL CONFIGURATION
# ============================================================================
models:
  # Sentence embeddings
  embedding_model: "all-MiniLM-L6-v2"  # SentenceTransformer model for embeddings

  # Named Entity Recognition
  ner_model: "en_core_web_sm"  # spaCy model for NER

  # LLM for topic labeling (Ollama)
  llm_model: "llama3.1:latest"  # Ollama model for topic labeling
  llm_endpoint: "http://localhost:11434/api/generate"
  llm_temperature: 0.3
  llm_max_tokens: 20

# ============================================================================
# POSTGRESQL DATABASE CONFIGURATION
# ============================================================================
database:
  # Connection parameters
  host: "localhost"
  port: 5432
  database: "knowledge_graph"
  user: "postgres"
  password: "postgres"

  # Table names
  graph_table: "graph"
  nodes_table: "nodes"

  # Connection pool settings
  pool_size: 10
  max_overflow: 20

# ============================================================================
# RETRIEVAL CONFIGURATION
# ============================================================================
retrieval:
  # Weight parameters for hybrid retrieval (must sum to 1.0)
  alpha: 0.4  # Weight for semantic similarity
  beta: 0.3  # Weight for thematic similarity
  gamma: 0.3  # Weight for entity-based similarity

  # Retrieval parameters
  top_k: 10  # Number of results to return
  theme_threshold: 0.1  # Minimum confidence for theme detection

  # Path scoring weights
  direct_path_weight: 1.0  # Entity -> Chunk (direct mention)
  co_occurrence_path_weight: 0.8  # Entity -> Co-occurring Entity -> Chunk
  theme_path_weight: 0.6  # Entity -> Theme -> Chunk

# ============================================================================
# VISUALIZATION CONFIGURATION
# ============================================================================
visualization:
  # General settings
  default_width: "100%"
  default_height: "900px"
  background_color: "#1a1a1a"
  font_color: "white"

  # Node size limits
  min_node_size: 10
  max_node_size: 50

  # Maximum nodes for full graph visualization
  max_nodes_full_view: 200
  max_nodes_entity_view: 50

  # Node colors by type
  colors:
    document: "#42a5f5"  # Blue
    chunk: "#ffd54f"  # Yellow
    theme: "#ab47bc"  # Purple
    entity: "#66bb6a"  # Green
    central_entity: "#ff1744"  # Red (for focused views)

  # Edge colors by type
  edge_colors:
    CONTAINS: "#666666"  # Gray
    HAS_TOPIC: "#ab47bc"  # Purple
    MENTIONS: "#66bb6a"  # Green
    RELATED_TO: "#ffa726"  # Orange
    CO_OCCURS: "#ef5350"  # Red
    SEMANTIC_SIM: "#42a5f5"  # Blue

  # Physics simulation
  physics:
    enabled: true
    gravity: -8000
    central_gravity: 0.3
    spring_length: 100
    damping: 0.09

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
logging:
  # Default logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  level: "INFO"

  # Log to file
  log_to_file: true

  # Log to console
  log_to_console: true

  # Log file rotation
  max_log_size_mb: 10  # Maximum size of each log file
  backup_count: 5  # Number of backup files to keep

  # Module-specific log levels (optional overrides)
  module_levels:
    graph_builder: "INFO"
    retrieval: "INFO"
    visualization: "INFO"

# ============================================================================
# EXPORT CONFIGURATION
# ============================================================================
export:
  # File naming patterns
  graph_pickle_pattern: "knowledge_graph_{timestamp}.gpickle"
  topic_model_pattern: "topic_model_{timestamp}.pkl"
  visualization_pattern: "{type}_{name}_{timestamp}.html"

  # Timestamp format
  timestamp_format: "%Y%m%d_%H%M%S"

  # Export formats
  supported_formats:
    - "gpickle"  # NetworkX pickle format
    - "postgres"  # PostgreSQL database
    - "json"  # JSON export (for visualization)
    - "csv"  # CSV export (for analysis)

# ============================================================================
# PERFORMANCE CONFIGURATION
# ============================================================================
performance:
  # Batch processing
  batch_size: 1000  # Batch size for database operations

  # Parallel processing
  n_jobs: -1  # Number of parallel jobs (-1 = use all cores)

  # Memory management
  max_memory_mb: 4096  # Maximum memory usage

  # Caching
  enable_cache: true
  cache_dir: ".cache"

# ============================================================================
# TESTING CONFIGURATION
# ============================================================================
testing:
  # Test claims for retrieval
  test_claims:
    - "Photo from Gaza 2008 shared on Facebook claiming Kashmir violence"
    - "Vaccine causes autism"
    - "Trump met Macron in France to discuss NATO"

  # Test parameters
  test_max_docs: 50
  test_chunk_size: 300
