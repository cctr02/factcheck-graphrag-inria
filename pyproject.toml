[project]
name = "prl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "nltk>=3.9.2",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyvis>=0.3.2",
    "pip>=25.2",
    "scikit-learn>=1.7.2",
    "sentence-transformers>=5.1.1",
    "spacy>=3.8.7",
    "tqdm>=4.67.1",
    "bertopic>=0.17.3",
    "keybert>=0.9.0",
    "requests>=2.32.5",
    "psycopg2-binary>=2.9.11",
    "faiss-cpu>=1.7.4",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    "gputil>=1.4.0",
    "psutil>=6.1.1",
]

[tool.uv.sources]
# Force PyTorch with CUDA 11.8 support
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

